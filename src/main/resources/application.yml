spring:
  application:
    name: OAuth2-Internal
  datasource:
    url: jdbc:mysql://localhost:3306/oauth2p
    username: root
    password: javalover

  security:
    oauth2:
     client:
      registration:
       google:
         client-id: ${GOOGLE_CLIENT_ID}
         client-secret: ${GOOGLE_CLIENT_SECRET}

         scope:
           - openid
           - profile
           - email
       github:
         client-id: ${GITHUB_CLIENT_ID}
         client-secret: ${GITHUB_CLIENT_SECRET}
         scope:
           - read:user
           - user:email
       facebook:
         client-id: ${FACEBOOK_CLIENT_ID}
         client-secret: ${FACEBOOK_CLIENT_SECRET}
         scope:
           - public_profile
           - email

  jpa:
   hibernate:
    ddl-auto: update
   show_sql: true
   properties:
    hibernate:
     format_sql: true
logging:
  level:
   org:
    springframework:
     security: TRACE
     web: DEBUG
server:
  port: 8080

